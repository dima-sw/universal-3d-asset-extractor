[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-3d-asset-extractor"
version = "0.1.0"
description = "Extensible platform for identifying and extracting 3D assets from games, archives and disc images"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "Pillow>=10.0"]

[project.optional-dependencies]
gui = ["PySide6>=6.5"]
formats = ["py7zr>=0.20", "rarfile>=4.1", "zstandard>=0.21", "lz4>=4.3"]
dev = ["pytest>=7.0"]

[project.scripts]
extractor = "app.cli:main"

[project.gui-scripts]
extractor-gui = "app.ui.app:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.plugins.builtin" = ["*/plugin.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
